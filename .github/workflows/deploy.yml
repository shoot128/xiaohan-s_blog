name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      "id-token": write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify template exists
        run: |
          if [ -f "js/config.template.js" ]; then
            echo "✅ config.template.js found"
          else
            echo "❌ js/config.template.js missing!"
            exit 1
          fi

      - name: Inject Secret
        env:
          BLOG_PASS: ${{ secrets.BLOG_PASS }}
        run: |
          if [ -z "$BLOG_PASS" ]; then
            echo "❌ BLOG_PASS secret is empty or not set!"
            exit 1
          fi
          cp js/config.template.js js/config.js
          sed -i "s/__BLOG_PASS_PLACEHOLDER__/$BLOG_PASS/g" js/config.js
          echo "✅ Secret injected"

      - name: Merge inbox files
        env:
          BLOG_PASS: ${{ secrets.BLOG_PASS }}
        run: |
          cat > merge.js << 'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const webcrypto = crypto.webcrypto.subtle;

          async function deriveKey(password) {
            const encoder = new TextEncoder();
            const keyMaterial = await webcrypto.importKey(
              'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
            );
            return webcrypto.deriveKey(
              {
                name: 'PBKDF2',
                salt: encoder.encode('blog-salt'),
                iterations: 100000,
                hash: 'SHA-256'
              },
              keyMaterial,
              { name: 'AES-GCM', length: 256 },
              false,
              ['encrypt', 'decrypt']
            );
          }

          async function decrypt(combined, key) {
            const data = Buffer.from(combined, 'base64');
            const iv = data.slice(0, 12);
            const ciphertext = data.slice(12);
            const decrypted = await webcrypto.decrypt(
              { name: 'AES-GCM', iv }, key, ciphertext
            );
            return new TextDecoder().decode(decrypted);
          }

          async function encrypt(text, key) {
            const encoder = new TextEncoder();
            const iv = crypto.randomBytes(12);
            const encrypted = await webcrypto.encrypt(
              { name: 'AES-GCM', iv }, key, encoder.encode(text)
            );
            const combined = Buffer.concat([iv, Buffer.from(encrypted)]);
            return combined.toString('base64');
          }

          async function normalizePost(post, fileName) {
            // 确保文章有 id
            if (!post.id) {
              post.id = 'post_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
            }
            // 如果没有作者信息，尝试从文件名提取用户ID
            if (!post.author_profile) {
              const match = fileName.match(/^(.+?)_posts\.enc$/);
              const userId = match ? match[1] : 'anonymous';
              post.author_id = userId;
              post.author_profile = {
                name: userId,
                avatar: '',
                bio: '',
                links: []
              };
            }
            // 确保 author_id 与 profile 中的 name 一致（如果缺失）
            if (!post.author_id) {
              post.author_id = post.author_profile?.name || 'anonymous';
            }
            return post;
          }

          (async () => {
            const password = process.env.BLOG_PASS;
            if (!password) {
              console.error('BLOG_PASS not set');
              process.exit(1);
            }
            const key = await deriveKey(password);

            const inboxDir = './inbox';
            const outputFile = './data/posts.enc';

            if (!fs.existsSync(inboxDir)) {
              fs.mkdirSync(inboxDir, { recursive: true });
            }

            let allPosts = [];
            const files = fs.readdirSync(inboxDir).filter(f => f.endsWith('.enc'));
            for (const file of files) {
              const content = fs.readFileSync(`${inboxDir}/${file}`, 'utf-8');
              try {
                const decrypted = await decrypt(content, key);
                const posts = JSON.parse(decrypted);
                // 兼容旧格式：为每篇文章补全作者信息
                for (let i = 0; i < posts.length; i++) {
                  posts[i] = await normalizePost(posts[i], file);
                }
                allPosts = allPosts.concat(posts);
              } catch (e) {
                console.error(`Error processing ${file}: ${e.message}`);
              }
            }

            // 按文章 ID 去重（保留后出现的版本，即文件名顺序靠后的覆盖前面的）
            const map = new Map();
            for (const post of allPosts) {
              map.set(post.id, post);
            }
            const merged = Array.from(map.values());

            const encrypted = await encrypt(JSON.stringify(merged), key);
            fs.writeFileSync(outputFile, encrypted);
            console.log(`Merged ${merged.length} posts into ${outputFile}`);
          })();
          EOF

          node merge.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
