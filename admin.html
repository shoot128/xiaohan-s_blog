<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · 静谧书斋</title>
    <script src="js/config.js"></script>
    <script src="js/blog-data.js"></script>
    <style>
        /* 完整样式与之前 admin.html 一致，此处省略以保持简洁，请从上一版 admin.html 复制完整 CSS */
        /* 为了节省篇幅，下面只保留结构，实际使用时请用完整的 admin.html 样式 */
        :root {
            --bg: #f9f7f4; --bg-card: #ffffff; --text: #2c2c2c; --text-secondary: #5a5a5a;
            --text-muted: #8a8a8a; --border: #e8e4e0; --accent: #a67c6b; --accent-soft: #d4c5bc;
            --danger: #c0392b; --danger-bg: #fdecea; --success: #2d7d46; --success-bg: #e8f5e9;
            --shadow: 0 2px 12px rgba(0,0,0,0.06); --shadow-hover: 0 6px 24px rgba(0,0,0,0.10);
            --radius: 20px; --radius-sm: 12px; --transition: 0.35s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        [data-theme="dark"] {
            --bg: #1a1a1e; --bg-card: #26262b; --text: #e8e4e0; --text-secondary: #b0aba6;
            --text-muted: #7a7570; --border: #3a3a3f; --accent: #c9a898; --accent-soft: #5a4f4a;
            --danger-bg: #3e1a1a; --success-bg: #1a3a1a; --shadow: 0 2px 12px rgba(0,0,0,0.25);
            --shadow-hover: 0 6px 24px rgba(0,0,0,0.35);
        }
        /* 其余样式同之前完整版，这里不再重复，请复制完整 admin.html 的 <style> 部分 */
    </style>
</head>
<body>
    <header style="border-bottom:1px solid var(--border); padding:12px 0;">
        <div class="container flex-between">
            <a href="index.html" style="font-weight:700; font-size:1.3rem;">📖 静谧书斋 · 管理</a>
            <button class="theme-toggle" id="themeToggle" title="切换主题">☀️</button>
        </div>
    </header>

    <main class="container" style="flex:1; padding-top:24px; padding-bottom:40px;">
        <!-- 登录界面 -->
        <div id="loginSection">
            <div class="card" style="max-width:440px; margin:40px auto;">
                <h2 style="margin-bottom:16px;">🔐 本地管理员登录</h2>
                <p class="text-secondary text-sm mb-3">密码固定为 <code>bilibili</code></p>
                <label>管理员密码</label>
                <input type="password" id="loginPassword" placeholder="输入密码" class="mb-2">
                <button id="loginBtn" style="width:100%;">登录</button>
            </div>
        </div>

        <!-- 管理面板（与之前完全一致，但加密时使用 PUBLIC_PASS） -->
        <div id="adminPanel" style="display:none;">
            <!-- 内部结构完全复制之前的 admin.html，仅需修改 <script> 部分 -->
            <!-- 因篇幅，此处展示关键修改，实际请使用完整 admin.html，替换 PUBLIC_PASS 为 window.__BLOG_PASS__ -->
        </div>
    </main>

    <script>
        (() => {
            const PUBLIC_PASS = window.__BLOG_PASS__ || 'fallback-dev-key';
            // 其余逻辑与之前 admin.html 完全相同，只需确保 encrypt 函数使用 PUBLIC_PASS
            // 完整代码请参照上一版 admin.html 并替换 PUBLIC_PASS 的定义
        })();
    </script>
</body>
</html>
