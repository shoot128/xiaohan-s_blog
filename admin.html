<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · 静谧书斋</title>
    <script src="js/config.js"></script>
    <script src="js/blog-data.js"></script>
    <style>
        :root {
            --bg: #f9f7f4;
            --bg-card: #ffffff;
            --text: #2c2c2c;
            --text-secondary: #5a5a5a;
            --text-muted: #8a8a8a;
            --border: #e8e4e0;
            --accent: #a67c6b;
            --accent-soft: #d4c5bc;
            --danger: #c0392b;
            --danger-bg: #fdecea;
            --success: #2d7d46;
            --success-bg: #e8f5e9;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-hover: 0 6px 24px rgba(0,0,0,0.10);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.35s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        [data-theme="dark"] {
            --bg: #1a1a1e;
            --bg-card: #26262b;
            --text: #e8e4e0;
            --text-secondary: #b0aba6;
            --text-muted: #7a7570;
            --border: #3a3a3f;
            --accent: #c9a898;
            --accent-soft: #5a4f4a;
            --danger-bg: #3e1a1a;
            --success-bg: #1a3a1a;
            --shadow: 0 2px 12px rgba(0,0,0,0.25);
            --shadow-hover: 0 6px 24px rgba(0,0,0,0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            font-family: var(--font); background: var(--bg); color: var(--text);
            line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column;
            transition: background var(--transition), color var(--transition);
        }
        a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
        a:hover { text-decoration: underline; opacity: 0.85; }
        button {
            cursor: pointer; font-family: inherit; font-size: 0.95rem; border: none;
            border-radius: 8px; padding: 10px 20px; transition: all var(--transition);
            background: var(--accent); color: #fff; display: inline-flex; align-items: center;
            gap: 6px; font-weight: 500; letter-spacing: 0.01em;
        }
        button:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: var(--shadow-hover); }
        button:active { transform: scale(0.95); }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        button.secondary { background: var(--border); color: var(--text); }
        button.danger { background: var(--danger); }
        button.small { padding: 6px 14px; font-size: 0.85rem; border-radius: 6px; }
        button.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent-soft); }
        input, textarea, select {
            font-family: inherit; font-size: 0.95rem; padding: 10px 14px;
            border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg);
            color: var(--text); transition: all var(--transition); width: 100%; resize: vertical;
        }
        input:focus, textarea:focus, select:focus {
            outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(166,124,107,0.12);
        }
        label { font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); display: block; margin-bottom: 4px; letter-spacing: 0.02em; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; font-size: 0.9rem; }
        .checkbox-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px 24px; width: 100%; }
        .card {
            background: var(--bg-card); border-radius: var(--radius); padding: 24px;
            box-shadow: var(--shadow); border: 1px solid var(--border); transition: all var(--transition);
            margin-bottom: 20px;
        }
        .card-sm { border-radius: var(--radius-sm); padding: 18px; }
        .flex { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .mt-1 { margin-top: 8px; } .mt-2 { margin-top: 16px; } .mt-3 { margin-top: 24px; }
        .mb-2 { margin-bottom: 16px; } .mb-3 { margin-bottom: 24px; }
        .text-center { text-align: center; } .text-muted { color: var(--text-muted); }
        .text-secondary { color: var(--text-secondary); } .text-accent { color: var(--accent); }
        .text-sm { font-size: 0.85rem; }
        .tag { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; background: #f0ebe6; color: #7a6b5f; }
        [data-theme="dark"] .tag { background: #3a3530; color: #c9beb5; }
        .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 0.78rem; padding: 3px 10px; border-radius: 14px; font-weight: 600; }
        .badge-featured { background: #fdf2e0; color: #b8860b; }
        .badge-public { background: #e3f2fd; color: #3a7ca5; }
        [data-theme="dark"] .badge-featured { background: #3a2e1a; color: #e0b860; }
        [data-theme="dark"] .badge-public { background: #1a2a3a; color: #7ab8e0; }
        .mode-banner { background: #fff8e1; color: #b8860b; padding: 10px 18px; border-radius: 12px; font-weight: 500; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        [data-theme="dark"] .mode-banner { background: #3a2e1a; color: #e0b860; }
        .theme-toggle {
            background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 50%;
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; cursor: pointer; transition: all var(--transition); padding: 0; color: var(--text);
        }
        .theme-toggle:hover { border-color: var(--accent); box-shadow: var(--shadow); }
        .toast { position: fixed; bottom: 30px; right: 30px; z-index: 300; padding: 12px 20px; border-radius: 10px; font-weight: 500; font-size: 0.9rem; box-shadow: 0 8px 24px rgba(0,0,0,0.2); animation: slideUp 0.3s ease; max-width: 400px; }
        .toast-success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
        .toast-error { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
        .toast-info { background: #e3f2fd; color: #3a7ca5; border: 1px solid #3a7ca5; }
        [data-theme="dark"] .toast-info { background: #1a2a3a; color: #7ab8e0; border-color: #7ab8e0; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.2s ease; }
        .modal { background: var(--bg-card); border-radius: var(--radius); padding: 28px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 640px) {
            .container { padding: 12px 14px; }
            .card { padding: 16px; }
            .flex-between { flex-direction: column; align-items: stretch; }
            button { padding: 8px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <header style="border-bottom:1px solid var(--border); padding:12px 0;">
        <div class="container flex-between">
            <a href="index.html" style="font-weight:700; font-size:1.3rem;">📖 静谧书斋 · 管理</a>
            <button class="theme-toggle" id="themeToggle" title="切换主题">☀️</button>
        </div>
    </header>

    <main class="container" style="flex:1; padding-top:24px; padding-bottom:40px;">
        <!-- 登录界面 -->
        <div id="loginSection">
            <div class="card" style="max-width:440px; margin:40px auto;">
                <h2 style="margin-bottom:16px;">🔐 本地管理员登录</h2>
                <p class="text-secondary text-sm mb-3">密码固定为 <code>bilibili</code></p>
                <label>管理员密码</label>
                <input type="password" id="loginPassword" placeholder="输入密码" class="mb-2">
                <button id="loginBtn" style="width:100%;">登录</button>
            </div>
        </div>

        <!-- 管理面板（登录后可见） -->
        <div id="adminPanel" style="display:none;">
            <div class="mode-banner">
                <span>🔒 离线模式</span>
                <span class="text-sm">数据仅保存在本地浏览器。导出加密包可发布到网络。</span>
                <button id="logoutBtn" class="small ghost" style="margin-left:auto;">完全退出</button>
            </div>

            <!-- 个人信息 -->
            <div class="card">
                <h3>👤 个人信息</h3>
                <div class="flex mt-2" style="gap:20px;">
                    <div style="flex:1; min-width:200px;"><label>头像图片 URL</label><input type="url" id="profileAvatar"></div>
                    <div style="flex:1; min-width:200px;"><label>昵称</label><input type="text" id="profileName"></div>
                </div>
                <div class="mt-2"><label>个人简介</label><textarea id="profileBio" rows="2"></textarea></div>
                <div class="mt-2">
                    <label>社交链接</label>
                    <div id="socialLinksContainer"></div>
                    <button id="addSocialLink" class="small secondary mt-1">➕ 添加链接</button>
                </div>
                <button id="saveProfileBtn" class="mt-3">保存个人信息</button>
            </div>

            <!-- 文章管理 -->
            <div class="card">
                <h3>📝 文章管理</h3>
                <form id="postForm" class="mt-2">
                    <input type="hidden" id="postId">
                    <div class="flex" style="gap:20px;">
                        <div style="flex:2;"><label>标题</label><input type="text" id="postTitle" required></div>
                        <div style="flex:1;"><label>日期</label><input type="date" id="postDate"></div>
                        <div style="flex:1;"><label>分类</label><input type="text" id="postCategory"></div>
                    </div>
                    <div class="flex mt-2" style="gap:20px;">
                        <label class="checkbox-label"><input type="checkbox" id="postFeatured"> ⭐ 设为精选</label>
                        <label class="checkbox-label"><input type="checkbox" id="postPublic"> 🌐 公开</label>
                    </div>
                    <div class="mt-2"><label>摘要</label><input type="text" id="postExcerpt"></div>
                    <div class="mt-2"><label>正文（支持 HTML）</label><textarea id="postContent" rows="8"></textarea></div>
                    <div class="flex mt-2">
                        <button type="submit" id="savePostBtn">💾 保存文章</button>
                        <button type="button" id="cancelEditBtn" class="secondary" style="display:none;">取消编辑</button>
                    </div>
                </form>
                <hr>
                <h4 class="mb-2">文章列表</h4>
                <div id="postListContainer"></div>
            </div>

            <!-- 数据备份与加密导出 -->
            <div class="card">
                <h3>💾 数据备份与发布</h3>
                <div class="flex" style="gap:12px; flex-wrap:wrap;">
                    <button id="exportBtn">📤 导出明文备份</button>
                    <label class="button small secondary" style="cursor:pointer; margin:0;">
                        📥 导入明文备份
                        <input type="file" id="importFile" accept=".json" style="display:none;">
                    </label>
                    <button id="exportEncryptedBtn">🔐 导出加密公开包</button>
                    <button id="exportProfileEncryptedBtn">🔐 导出个人信息加密包</button>
                </div>
                <p class="text-sm text-secondary mt-2">
                    “导出加密公开包”生成 <code>posts.enc</code>，“导出个人信息加密包”生成 <code>profile.enc</code>，上传到仓库 <code>data/</code> 目录下即可。
                </p>
            </div>

            <div class="text-center text-sm text-muted mt-3">📡 山脉工作室 & DeepSeek 荣誉出品</div>
        </div>
    </main>

    <div id="toastContainer"></div>

    <div id="confirmModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3 id="confirmTitle">确认操作</h3>
            <p id="confirmMsg"></p>
            <div class="flex-between mt-3">
                <button id="confirmCancel" class="secondary">取消</button>
                <button id="confirmOk" class="danger">确认</button>
            </div>
        </div>
    </div>

    <script>
        (() => {
            // ========== 从 config.js 获取密钥 ==========
            const PUBLIC_PASS = window.__BLOG_PASS__ || 'fallback-dev-key';

            // ========== 主题 ==========
            const themeToggle = document.getElementById('themeToggle');
            const savedTheme = localStorage.getItem('blog_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';
            themeToggle.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('blog_theme', next);
                themeToggle.textContent = next === 'dark' ? '🌙' : '☀️';
            });

            // ========== Toast ==========
            function showToast(msg, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = msg;
                container.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; }, 2500);
                setTimeout(() => toast.remove(), 3000);
            }

            // ========== 工具函数 ==========
            function generateId() { return 'post_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6); }
            async function sha256(m) { const b = new TextEncoder().encode(m); const h = await crypto.subtle.digest('SHA-256', b); return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join(''); }
            function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

            // ========== 加密解密 ==========
            async function deriveKey() {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(PUBLIC_PASS), 'PBKDF2', false, ['deriveKey']);
                return crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: enc.encode('blog-salt'), iterations: 100000, hash: 'SHA-256' },
                    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt']
                );
            }
            async function encrypt(text) {
                const key = await deriveKey();
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
                const combined = new Uint8Array(iv.length + encrypted.byteLength);
                combined.set(iv, 0);
                combined.set(new Uint8Array(encrypted), iv.length);
                return btoa(String.fromCharCode(...combined));
            }

            // ========== 登录 ==========
            const FIXED_PASSWORD = 'bilibili';
            const PASSWORD_HASH_KEY = 'blog_admin_password_hash';
            const LOGIN_STATUS_KEY = 'blog_admin_logged_in';

            async function ensureHash() {
                if (!localStorage.getItem(PASSWORD_HASH_KEY)) {
                    localStorage.setItem(PASSWORD_HASH_KEY, await sha256(FIXED_PASSWORD));
                }
            }

            function showAdminPanel() {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadProfile();
                renderPostList();
            }

            document.getElementById('loginBtn').addEventListener('click', async () => {
                const input = document.getElementById('loginPassword').value;
                const storedHash = localStorage.getItem(PASSWORD_HASH_KEY);
                if (await sha256(input) === storedHash) {
                    localStorage.setItem(LOGIN_STATUS_KEY, 'true');
                    showToast('登录成功', 'success');
                    showAdminPanel();
                } else {
                    showToast('密码错误', 'error');
                }
            });

            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem(LOGIN_STATUS_KEY);
                location.reload();
            });

            // ========== 个人信息 ==========
            function loadProfile() {
                const p = BlogData.getProfile();
                document.getElementById('profileAvatar').value = p.avatar || '';
                document.getElementById('profileName').value = p.name || '';
                document.getElementById('profileBio').value = p.bio || '';
                renderSocialLinks(p.links || []);
            }
            function renderSocialLinks(links) {
                const c = document.getElementById('socialLinksContainer');
                c.innerHTML = links.map((l, i) => `
                    <div class="flex mt-1" style="gap:8px;">
                        <input type="text" placeholder="名称" value="${escapeHTML(l.name)}" data-link-name style="flex:1;">
                        <input type="url" placeholder="URL" value="${escapeHTML(l.url)}" data-link-url style="flex:2;">
                        <button type="button" class="small danger remove-link" data-idx="${i}">✕</button>
                    </div>`).join('');
                document.querySelectorAll('.remove-link').forEach(b => b.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.dataset.idx);
                    const data = BlogData.getProfile();
                    data.links.splice(idx, 1);
                    BlogData.saveProfile(data);
                    renderSocialLinks(data.links);
                }));
            }
            document.getElementById('addSocialLink').addEventListener('click', () => {
                const p = BlogData.getProfile();
                p.links.push({ name: '', url: '' });
                BlogData.saveProfile(p);
                renderSocialLinks(p.links);
            });
            document.getElementById('saveProfileBtn').addEventListener('click', () => {
                const p = {
                    avatar: document.getElementById('profileAvatar').value.trim(),
                    name: document.getElementById('profileName').value.trim(),
                    bio: document.getElementById('profileBio').value.trim(),
                    links: Array.from(document.querySelectorAll('[data-link-name]')).map((el, i) => ({
                        name: el.value.trim(),
                        url: document.querySelectorAll('[data-link-url]')[i].value.trim()
                    })).filter(l => l.name || l.url)
                };
                BlogData.saveProfile(p);
                showToast('个人信息已保存', 'success');
            });

            // ========== 文章管理 ==========
            const postForm = document.getElementById('postForm');
            const postId = document.getElementById('postId');
            const postTitle = document.getElementById('postTitle');
            const postDate = document.getElementById('postDate');
            postDate.value = new Date().toISOString().split('T')[0];
            const postCategory = document.getElementById('postCategory');
            const postFeatured = document.getElementById('postFeatured');
            const postPublic = document.getElementById('postPublic');
            const postExcerpt = document.getElementById('postExcerpt');
            const postContent = document.getElementById('postContent');
            const savePostBtn = document.getElementById('savePostBtn');
            const cancelEditBtn = document.getElementById('cancelEditBtn');
            let editingId = null;

            function resetForm() {
                postId.value = '';
                postTitle.value = '';
                postCategory.value = '';
                postFeatured.checked = false;
                postPublic.checked = false;
                postExcerpt.value = '';
                postContent.value = '';
                postDate.value = new Date().toISOString().split('T')[0];
                editingId = null;
                savePostBtn.textContent = '💾 保存文章';
                cancelEditBtn.style.display = 'none';
            }
            cancelEditBtn.addEventListener('click', resetForm);

            postForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const post = {
                    id: editingId || generateId(),
                    title: postTitle.value.trim(),
                    date: postDate.value,
                    category: postCategory.value.trim(),
                    featured: postFeatured.checked,
                    public: postPublic.checked,
                    excerpt: postExcerpt.value.trim(),
                    content: postContent.value
                };
                if (!post.title) return showToast('标题不能为空', 'error');
                if (post.featured) {
                    BlogData.getAllPosts().forEach(p => { if (p.id !== post.id && p.featured) { p.featured = false; BlogData.updatePost(p); } });
                }
                if (editingId) BlogData.updatePost(post);
                else BlogData.addPost(post);
                resetForm();
                renderPostList();
                showToast(editingId ? '文章已更新' : '文章已发布', 'success');
            });

            function editPost(id) {
                const post = BlogData.getPost(id);
                if (!post) return;
                postId.value = post.id;
                postTitle.value = post.title;
                postDate.value = post.date;
                postCategory.value = post.category || '';
                postFeatured.checked = post.featured;
                postPublic.checked = post.public;
                postExcerpt.value = post.excerpt || '';
                postContent.value = post.content || '';
                editingId = post.id;
                savePostBtn.textContent = '✏️ 更新文章';
                cancelEditBtn.style.display = 'inline-flex';
                window.scrollTo({ top: postForm.offsetTop - 80, behavior: 'smooth' });
            }
            function deletePost(id) {
                showConfirm('删除文章', '确定要永久删除这篇文章吗？', () => {
                    BlogData.removePost(id);
                    renderPostList();
                    showToast('文章已删除', 'info');
                });
            }
            function toggleFeatured(id) {
                const post = BlogData.getPost(id);
                if (!post) return;
                post.featured = !post.featured;
                if (post.featured) {
                    BlogData.getAllPosts().forEach(p => { if (p.id !== id && p.featured) { p.featured = false; BlogData.updatePost(p); } });
                }
                BlogData.updatePost(post);
                renderPostList();
            }
            function togglePublic(id) {
                const post = BlogData.getPost(id);
                if (!post) return;
                post.public = !post.public;
                BlogData.updatePost(post);
                renderPostList();
            }
            function renderPostList() {
                const posts = BlogData.getAllPosts();
                const c = document.getElementById('postListContainer');
                if (!posts.length) { c.innerHTML = '<p class="text-muted text-sm">暂无文章。</p>'; return; }
                c.innerHTML = posts.map(post => `
                    <div class="card-sm" style="border:1px solid var(--border); border-radius:12px; margin-bottom:12px;">
                        <div class="flex-between">
                            <div>
                                <strong>${escapeHTML(post.title)}</strong>
                                <div class="text-sm text-muted">📅 ${escapeHTML(post.date)} ${post.category ? `<span class="tag">${escapeHTML(post.category)}</span>` : ''}</div>
                            </div>
                            <div style="display:flex; gap:4px;">
                                ${post.featured ? '<span class="badge badge-featured">⭐ 精选</span>' : ''}
                                ${post.public ? '<span class="badge badge-public">🌐 公开</span>' : ''}
                            </div>
                        </div>
                        <div class="flex mt-2" style="gap:8px;">
                            <button class="small ghost" onclick="window._toggleFeatured('${post.id}')">${post.featured ? '取消精选' : '⭐ 精选'}</button>
                            <button class="small ghost" onclick="window._togglePublic('${post.id}')">${post.public ? '取消公开' : '🌐 公开'}</button>
                            <button class="small ghost" onclick="window._editPost('${post.id}')">✏️ 编辑</button>
                            <button class="small danger" onclick="window._deletePost('${post.id}')">🗑 删除</button>
                        </div>
                    </div>`).join('');
            }
            window._editPost = editPost;
            window._deletePost = deletePost;
            window._toggleFeatured = toggleFeatured;
            window._togglePublic = togglePublic;

            // ========== 备份与加密导出 ==========
            document.getElementById('exportBtn').addEventListener('click', () => {
                const backup = {
                    profile: BlogData.getProfile(),
                    posts: BlogData.getAllPosts(),
                    publicIndex: BlogData.getPublicIndex(),
                    postIndex: BlogData.getPostIndex()
                };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `blog_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                showToast('明文备份已导出', 'success');
            });

            document.getElementById('importFile').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const backup = JSON.parse(ev.target.result);
                        BlogData.saveProfile(backup.profile || {});
                        BlogData.savePostIndex(backup.postIndex || []);
                        BlogData.savePublicIndex(backup.publicIndex || []);
                        (backup.posts || []).forEach(p => BlogData.savePost(p));
                        loadProfile();
                        renderPostList();
                        showToast('数据已导入', 'success');
                    } catch (ex) { showToast('无效的备份文件', 'error'); }
                };
                reader.readAsText(file);
                this.value = '';
            });

            document.getElementById('exportEncryptedBtn').addEventListener('click', async () => {
                const posts = BlogData.getAllPosts().filter(p => p.public);
                if (posts.length === 0) return showToast('没有公开文章可导出', 'error');
                const plain = JSON.stringify(posts);
                const encrypted = await encrypt(plain);
                const blob = new Blob([encrypted], { type: 'application/octet-stream' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'posts.enc';
                a.click();
                showToast('加密公开包已导出，请上传至 data/posts.enc', 'success');
            });

            document.getElementById('exportProfileEncryptedBtn').addEventListener('click', async () => {
                const profile = BlogData.getProfile();
                const plain = JSON.stringify(profile);
                const encrypted = await encrypt(plain);
                const blob = new Blob([encrypted], { type: 'application/octet-stream' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'profile.enc';
                a.click();
                showToast('个人信息加密包已导出，请上传至 data/profile.enc', 'success');
            });

            // ========== 确认对话框 ==========
            function showConfirm(title, msg, onConfirm) {
                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmMsg').textContent = msg;
                const modal = document.getElementById('confirmModal');
                modal.style.display = 'flex';
                document.getElementById('confirmOk').onclick = () => { modal.style.display = 'none'; onConfirm(); };
                document.getElementById('confirmCancel').onclick = () => { modal.style.display = 'none'; };
            }

            // ========== 初始化 ==========
            (async () => {
                await ensureHash();
                if (localStorage.getItem(LOGIN_STATUS_KEY) === 'true') showAdminPanel();
            })();
        })();
    </script>
</body>
</html>
